services:
  - type: web
    name: arena-back
    runtime: node
    rootDir: back
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: utn
      - key: BASE_URL
        sync: false
